<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>i-Audit-Liv · BPCL Internal Audit</title>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="data.js"></script>

<style>
  :root{
    --navy:#003a72; --navy2:#00539c; --blue:#0072bc; --blue-l:#e6f1fa;
    --gold:#fdb913; --gold2:#f7a800;
    --ink:#1c2733; --muted:#5b6b7f; --line:#e2e8f1;
    --bg:#f3f6fa; --card:#ffffff;
    --green:#1a9f6b; --amber:#e08a00; --red:#d2453f;
    --shadow:0 1px 3px rgba(0,58,114,.08),0 8px 24px rgba(0,58,114,.07);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  header.app{background:linear-gradient(120deg,var(--navy),var(--navy2));color:#fff;padding:12px 26px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:30;box-shadow:0 2px 12px rgba(0,0,0,.18);border-bottom:3px solid var(--gold)}
  .brand-logo{height:44px;width:auto;max-width:150px;display:block;background:#fff;border-radius:8px;padding:5px 8px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.15)}
  .brand-badge{width:46px;height:46px;border-radius:10px;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-weight:900;font-size:18px;cursor:pointer;box-shadow:inset 0 -3px 0 rgba(0,0,0,.14);letter-spacing:.5px}
  .brand h1{font-size:17px;margin:0;letter-spacing:.3px;font-weight:800}
  .brand p{margin:2px 0 0;font-size:11.5px;opacity:.85}
  header.app .spacer{flex:1}
  .org-tag{font-size:12px;opacity:.9;border-left:1px solid rgba(255,255,255,.3);padding-left:14px;font-weight:600}
  .org-tag b{color:var(--gold)}
  .wrap{max-width:1200px;margin:0 auto;padding:26px}
  .crumbs{font-size:13px;color:var(--muted);margin-bottom:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .crumbs button{all:unset;cursor:pointer;color:var(--blue);font-weight:600}
  .crumbs .sep{opacity:.5}
  .page-title{font-size:22px;font-weight:800;margin:0 0 4px;color:var(--navy)}
  .page-sub{color:var(--muted);font-size:13.5px;margin:0 0 22px}
  .home2{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:8px}
  .homecard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:30px;box-shadow:var(--shadow);cursor:pointer;transition:.18s;position:relative;overflow:hidden;min-height:230px;display:flex;flex-direction:column}
  .homecard:hover{transform:translateY(-4px);box-shadow:0 16px 40px rgba(0,58,114,.16);border-color:#bcd4ea}
  .homecard .hc-top{width:64px;height:64px;border-radius:16px;display:grid;place-items:center;font-size:32px;margin-bottom:18px}
  .homecard.atr .hc-top{background:#fff3d6} .homecard.rt .hc-top{background:var(--blue-l)}
  .homecard h3{margin:0 0 8px;font-size:22px;color:var(--navy)}
  .homecard p{margin:0;color:var(--muted);font-size:14px;line-height:1.6;flex:1}
  .homecard .go{margin-top:18px;font-weight:700;color:var(--blue);font-size:14px}
  .homecard .ribbon{position:absolute;top:0;left:0;right:0;height:6px}
  .homecard.atr .ribbon{background:var(--gold)} .homecard.rt .ribbon{background:var(--blue)}
  .homecard .mini{display:flex;gap:18px;margin-top:16px}
  .homecard .mini b{display:block;font-size:20px;color:var(--navy)} .homecard .mini span{font-size:11px;color:var(--muted)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
  .bu-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow);cursor:pointer;transition:.18s;position:relative;overflow:hidden}
  .bu-card:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(0,58,114,.14);border-color:#bcd4ea}
  .bu-card.disabled{cursor:not-allowed;opacity:.72}
  .bu-ic{font-size:30px;line-height:1}
  .bu-name{font-size:18px;font-weight:800;margin:12px 0 2px;color:var(--navy)}
  .bu-full{font-size:12.5px;color:var(--muted)}
  .bu-stats{display:flex;gap:16px;margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
  .bu-stat b{display:block;font-size:18px;color:var(--navy)} .bu-stat span{font-size:11px;color:var(--muted)}
  .pill{position:absolute;top:14px;right:14px;font-size:10.5px;font-weight:700;padding:4px 9px;border-radius:999px}
  .pill.active{background:#e5f6ee;color:var(--green)} .pill.coming{background:#f1f3f7;color:var(--muted)}
  .accent{position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--gold)}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:20px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
  .kpi b{display:block;font-size:22px;color:var(--navy);line-height:1.1} .kpi span{font-size:11.5px;color:var(--muted)}
  .kpi.warn b{color:var(--red)} .kpi.hi b{color:var(--amber)} .kpi.ok b{color:var(--green)}
  .kpi .k-top{height:4px;border-radius:3px;margin:-14px -16px 12px;background:var(--blue)}
  .kpi.warn .k-top{background:var(--red)} .kpi.hi .k-top{background:var(--gold)} .kpi.ok .k-top{background:var(--green)}
  .navcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:12px;margin-bottom:22px}
  .navcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px;box-shadow:var(--shadow);cursor:pointer;transition:.16s;position:relative;overflow:hidden;text-align:left}
  .navcard:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(0,58,114,.14);border-color:#bcd4ea}
  .navcard.on{background:var(--navy);border-color:var(--navy)}
  .navcard.on .nc-label,.navcard.on .nc-ic{color:#fff}
  .navcard.on .nc-num{color:var(--navy);background:var(--gold)}
  .navcard.on::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--gold)}
  .nc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .nc-ic{font-size:22px;line-height:1}
  .nc-num{font-size:13px;font-weight:800;background:var(--blue-l);color:var(--blue);padding:2px 9px;border-radius:999px}
  .nc-label{font-size:14px;font-weight:700;color:var(--ink);line-height:1.25}
  .nc-sub{font-size:11px;color:var(--muted);margin-top:3px}
  .navcard.on .nc-sub{color:rgba(255,255,255,.7)}
  .subtabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
  .stab{all:unset;cursor:pointer;padding:8px 16px;border-radius:999px;font-size:13px;font-weight:700;border:1px solid var(--line);color:#334155;display:flex;align-items:center;gap:8px;background:#fff}
  .stab:hover{background:var(--blue-l)}
  .stab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .stab.on.imp{background:#e5f6ee;border-color:#bfe6cf;color:var(--green)}
  .stab.on.flat{background:#eef1f6;border-color:#d5dbe6;color:var(--muted)}
  .stab.on.eff{background:#fdecec;border-color:#f2c9c9;color:var(--red)}
  .stab .sdot{width:8px;height:8px;border-radius:50%}
  .stab .sc{font-size:11px;font-weight:800;background:rgba(0,0,0,.06);padding:1px 7px;border-radius:999px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:var(--shadow);margin-bottom:18px}
  .panel h2{margin:0 0 4px;font-size:20px;color:var(--navy)}
  .intro{color:var(--muted);font-size:13.5px;line-height:1.55;margin:0 0 18px}
  .sec-h{font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--blue);margin:24px 0 12px;display:flex;align-items:center;gap:10px}
  .sec-h .ln{flex:1;height:1px;background:var(--line)}
  .badge{display:inline-block;font-size:11.5px;font-weight:700;padding:4px 11px;border-radius:999px}
  .badge.imp{background:#e5f6ee;color:var(--green)} .badge.flat{background:#eef1f6;color:var(--muted)} .badge.eff{background:#fdecec;color:var(--red)}
  .tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
  .tcard{border:1px solid var(--line);border-radius:13px;padding:16px;background:#fff}
  .tcard .tt{font-size:14.5px;font-weight:700;margin:0 0 3px;color:var(--navy)}
  .tcard .tg{font-size:12px;font-weight:700;margin:0 0 1px}
  .tcard .tg.imp{color:var(--green)} .tcard .tg.flat{color:var(--muted)} .tcard .tg.eff{color:var(--red)} .tcard .tg.up{color:var(--amber)}
  .tcard .ts{font-size:11.5px;color:var(--muted);margin:0 0 10px}
  .chart{display:flex;align-items:flex-end;gap:4px;height:96px;padding:14px 2px 0;border-bottom:1px solid var(--line)}
  .bar{flex:1;background:linear-gradient(180deg,var(--blue),var(--navy));border-radius:3px 3px 0 0;position:relative;min-height:2px}
  .bar:hover{background:var(--gold)} .bar.peak{background:linear-gradient(180deg,var(--gold),var(--gold2))}
  .bar.imp{background:linear-gradient(180deg,#37b98a,#1a9f6b)} .bar.eff{background:linear-gradient(180deg,#e26d6d,#c23b3b)}
  .bar .v{position:absolute;top:-15px;left:50%;transform:translateX(-50%);font-size:9.5px;font-weight:700;color:var(--navy)}
  .xlab{display:flex;gap:4px;margin-top:4px}
  .xlab span{flex:1;text-align:center;font-size:8.5px;color:var(--muted)}
  .box{border-radius:11px;padding:14px 16px;font-size:13.5px;line-height:1.55;margin-top:14px}
  .box.why{background:#fff8ec;border:1px solid #f6e4b8}
  .box.sol{background:#eaf7f0;border:1px solid #bfe6cf}
  .box.take{background:var(--blue-l);border:1px solid #cfe0f5}
  .box b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px}
  .box.why b{color:var(--amber)} .box.sol b{color:var(--green)} .box.take b{color:var(--blue)}
  table.tb{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
  table.tb th{background:var(--navy);color:#fff;text-align:left;padding:10px;font-weight:600}
  table.tb th.n,table.tb td.n{text-align:center}
  table.tb td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
  table.tb tr:hover td{background:#fafbfd}
  table.tb tr.tot td{background:#eef4fb;font-weight:800;color:var(--navy);border-top:2px solid var(--navy)}
  .chip{display:inline-block;min-width:26px;text-align:center;font-weight:800;border-radius:7px;padding:2px 7px;font-size:12.5px}
  .chip.h{background:#fdecec;color:var(--red)} .chip.o{background:#fff5e6;color:var(--amber)} .chip.z{color:var(--muted)} .chip.m{background:var(--blue-l);color:var(--blue)} .chip.l{background:#eef1f6;color:var(--muted)}
  .lnk{color:var(--blue);font-weight:700;cursor:pointer} .lnk:hover{text-decoration:underline}
  .dd{display:grid;grid-template-columns:230px 1fr;gap:16px;align-items:start}
  .ddnav{background:#fff;border:1px solid var(--line);border-radius:13px;padding:8px;box-shadow:var(--shadow);position:sticky;top:150px}
  .ddnav .it{display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:9px;cursor:pointer;font-size:13px;font-weight:600;color:#334155}
  .ddnav .it:hover{background:var(--blue-l)} .ddnav .it.on{background:var(--navy);color:#fff}
  .ddnav .dot{width:8px;height:8px;border-radius:50%;flex:none;background:#c3d3e6}
  .ddnav .it.on .dot{background:var(--gold)}
  .ddnav h5{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:10px 10px 6px}
  .panel.dv{padding:20px 22px}
  .dv h2{font-size:18px;margin:0 0 5px}
  .dv-sub{color:var(--muted);font-size:12.5px;line-height:1.5;margin:0 0 14px}
  .dv-stats{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
  .dv-stats .s{flex:1;min-width:104px;background:#fafbfd;border:1px solid var(--line);border-radius:11px;padding:11px 10px;text-align:center}
  .dv-stats .s b{display:block;font-size:23px;color:var(--navy);line-height:1.05} .dv-stats .s span{font-size:10px;color:var(--muted);line-height:1.25;display:block;margin-top:3px}
  .dv-cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start;margin-bottom:12px}
  .dv-h{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--blue);font-weight:800;margin-bottom:8px}
  ul.obs{margin:0;padding:0;list-style:none}
  ul.obs li{display:flex;justify-content:space-between;gap:10px;padding:7px 11px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;font-size:12.5px;line-height:1.35}
  ul.obs li .cnt{font-weight:800;color:var(--blue);flex:none}
  .rc-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px}
  .rc{border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:11px;padding:14px;background:#fff}
  .rc b{display:block;font-size:13.5px;margin-bottom:5px;color:var(--navy)} .rc span{font-size:12.5px;color:var(--muted);line-height:1.5}
  .rgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .hbar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:12.5px}
  .hbar-row .lbl{width:130px;font-weight:600;color:var(--navy);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hbar-track{flex:1;background:#eef1f6;border-radius:6px;height:22px;position:relative;overflow:hidden}
  .hbar-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--blue),var(--navy));display:flex;align-items:center}
  .hbar-row .val{width:52px;text-align:right;font-weight:800;color:var(--navy)}
  .hbar-row.cmp{margin-bottom:5px;font-size:12px}
  .hbar-row.cmp .hbar-track{height:16px}
  .hbar-row.cmp .lbl{width:120px}
  .hbar-row.cmp .val{width:40px}
  .entlist{max-height:300px;overflow-y:auto;padding-right:6px}
  .entlist::-webkit-scrollbar{width:7px}
  .entlist::-webkit-scrollbar-thumb{background:#c3d3e6;border-radius:4px}
  .entlist::-webkit-scrollbar-track{background:transparent}
  table.heat{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}
  table.heat th,table.heat td{padding:9px;text-align:center;border:1px solid var(--line)}
  table.heat th{background:var(--navy);color:#fff;font-weight:600}
  table.heat td.pri{background:#eef4fb;font-weight:800;color:var(--navy);text-align:left}
  .bands{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
  .band{border-radius:10px;padding:10px 16px;color:#fff;font-weight:700;font-size:13px}
  .band span{display:block;font-size:22px}
  .band.c{background:#b23131} .band.h{background:#e08a00} .band.m{background:var(--blue)} .band.l{background:#5a6b80}
  .icard{border:1px solid var(--line);border-radius:13px;padding:16px;background:#fff;position:relative;overflow:hidden}
  .icard .itop{border-left:4px solid var(--blue);padding-left:10px;margin-bottom:10px}
  .icard h4{margin:0;font-size:14.5px;color:var(--navy)}
  .icard .isub{font-size:11.5px;color:var(--muted);margin-top:2px}
  .icard .ipct{position:absolute;top:14px;right:16px;font-size:12px;font-weight:800;color:var(--blue);background:var(--blue-l);padding:2px 9px;border-radius:999px}
  .hml{display:flex;gap:6px;margin:10px 0}
  .spread{display:flex;gap:4px;margin-top:6px}
  .spread .sp{flex:1;text-align:center;background:#fafbfd;border:1px solid var(--line);border-radius:7px;padding:5px 2px}
  .spread .sp b{display:block;font-size:13px;color:var(--navy)} .spread .sp span{font-size:9px;color:var(--muted)}
  .itop-terr{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.5}
  .scgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
  .flip{perspective:1200px;min-height:200px;cursor:pointer}
  .flip .flip-inner{position:relative;width:100%;height:200px;transition:transform .55s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d}
  .flip.on .flip-inner{transform:rotateY(180deg)}
  .flip-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid var(--line);border-radius:13px;padding:15px;background:#fff;overflow:hidden;box-shadow:var(--shadow)}
  .flip-back{transform:rotateY(180deg);background:#fbfcfe}
  .sc-top{position:absolute;left:0;right:0;top:0;height:4px}
  .sc-front h4{margin:0;font-size:14.5px;color:var(--navy);display:flex;justify-content:space-between;align-items:baseline}
  .sc-front h4 b{font-size:22px}
  .sc-sub{font-size:11px;color:var(--muted);margin:2px 0 12px}
  .sc-chips{display:flex;gap:6px;margin-bottom:8px}
  .sc-legacy{font-size:11px;font-weight:700;color:var(--red);background:#fdecec;border-radius:7px;padding:5px 9px;margin-bottom:4px;line-height:1.3}
  .sc-legacy.zero{color:var(--muted);background:#eef1f6}
  .sc-foot{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px;position:absolute;left:15px;right:15px;bottom:14px}
  .sc-foot b{font-size:14px}
  .flip-hint{position:absolute;bottom:12px;right:14px;font-size:9.5px;color:var(--muted);opacity:.8}
  .sc-back h4{margin:0 0 2px;font-size:14px;color:var(--navy)}
  .cyc-row{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:12.5px}
  .cyc-row .ci{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-weight:800;color:#fff;flex:none;font-size:13px}
  .cyc-row.red .ci{background:var(--green)} .cyc-row.add .ci{background:var(--amber)}
  .cyc-row b{color:var(--navy)} .cyc-row span{color:var(--muted)}
  .cyc-net{margin-top:8px;padding:7px 10px;border-radius:8px;font-size:12px;font-weight:700;text-align:center}
  .cyc-net.pos{background:#e5f6ee;color:var(--green)} .cyc-net.neg{background:#fdecec;color:var(--red)} .cyc-net.zero{background:#eef1f6;color:var(--muted)}
  .cyc-note{font-size:10.5px;color:var(--muted);margin-top:8px;line-height:1.4}
  .conc-row{display:flex;align-items:center;gap:12px;margin-bottom:11px;font-size:12.5px}
  .conc-lbl{width:150px;font-weight:600;color:var(--navy);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .conc-track{flex:1;background:#dbe6f2;border-radius:7px;height:22px;position:relative;overflow:hidden}
  .conc-fill{height:100%;background:linear-gradient(90deg,#e06a63,var(--red));border-radius:7px 0 0 7px;display:flex;align-items:center;justify-content:flex-end}
  .conc-fill span{color:#fff;font-size:10.5px;font-weight:800;padding-right:7px;white-space:nowrap}
  .conc-cap{width:150px;font-size:11.5px;color:var(--muted);white-space:nowrap;text-align:left}
  .conc-cap b{color:var(--navy)}
  .lg-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .lg-toolbar .grow{flex:1}
  table.lg{width:100%;border-collapse:collapse;font-size:12.5px}
  table.lg th{background:var(--navy);color:#fff;text-align:left;padding:9px 10px;font-weight:600;white-space:nowrap;position:sticky;top:0}
  table.lg td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  table.lg tr:hover td{background:#fafbfd}
  table.lg input,table.lg .lg-date{border:1px solid var(--line);border-radius:7px;padding:6px 8px;font-size:12px;font-family:inherit;width:100%;background:#fff}
  table.lg input:focus,table.lg .lg-date:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-l)}

<body>
<div id="root"></div>

<script type="text/babel">
const {useState,useRef,useEffect} = React;
const DB = window.AUDIT_DATA;
const FY = DB.fyLabels;
const CUT_2024 = new Date(2024,2,31);
const ADMIN_SECRET = "liv-admin";
async function apiGetATR(){ try{ const r=await fetch("/api/atr",{cache:"no-store"}); if(!r.ok) return null; const j=await r.json(); return (j&&j.aggregate)?j.aggregate:null; }catch(e){ return null; } }
async function apiPostATR(agg){ try{ const r=await fetch("/api/atr",{method:"POST",headers:{"Content-Type":"application/json","x-admin-secret":ADMIN_SECRET},body:JSON.stringify({aggregate:agg,fileName:agg?agg.fileName:""})}); return r.ok; }catch(e){ return false; } }
async function apiGetQueries(bu){ try{ const r=await fetch("/api/queries?bu="+encodeURIComponent(bu),{cache:"no-store"}); if(!r.ok) return null; return await r.json(); }catch(e){ return null; } }
async function apiPostQuery(payload){ try{ const r=await fetch("/api/queries",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)}); return r.ok; }catch(e){ return false; } }
async function apiGetLegacy(){ try{ const r=await fetch("/api/legacy",{cache:"no-store"}); if(!r.ok) return null; const j=await r.json(); return (j&&j.map)?j.map:{}; }catch(e){ return null; } }
async function apiPostLegacy(map){ try{ const r=await fetch("/api/legacy",{method:"POST",headers:{"Content-Type":"application/json","x-admin-secret":ADMIN_SECRET},body:JSON.stringify({map})}); return r.ok; }catch(e){ return false; } }
function BrandLogo({onClick}){
  const [failed,setFailed]=useState(false);
  if(failed) return <div className="brand-badge" onClick={onClick} title="BPCL">iL</div>;
  return <img className="brand-logo" src="bpcl-logo.png" alt="BPCL" onClick={onClick} onError={()=>setFailed(true)} />;
}
function MiniBars({data, labels, tone}){
  const max=Math.max(...data,1), peak=Math.max(...data);
  return (<div><div className="chart">{data.map((v,i)=>(<div key={i} className={"bar "+(tone||"")+(v===peak&&v>0?" peak":"")} style={{height:(v/max*100)+"%"}} title={labels[i]+": "+v}>{v>0 && <span className="v">{v}</span>}</div>))}</div><div className="xlab">{labels.map((f,i)=><span key={i}>{f}</span>)}</div></div>);
}
function Bars({data, tone}){ return <MiniBars data={data} labels={FY} tone={tone}/>; }
const ATR_KEY="iai_atr_data"; const LEG_KEY="iai_legacy_meta";
function pickCol(headers, res){ return headers.find(h=> res.some(r=> r.test(h)) ); }
function normPri(v){ if(v==null) return "Medium"; const s=String(v).trim().toLowerCase(); if(s.startsWith("h")||s.includes("high")) return "High"; if(s.startsWith("l")||s.includes("low")) return "Low"; return "Medium"; }
function toDate(v){ if(v instanceof Date) return v; if(typeof v==="number"){ return new Date(Math.round((v-25569)*86400*1000)); } const d=new Date(v); return isNaN(d)?null:d; }
function fmtDate(d){ if(!d) return ""; const p=n=>String(n).padStart(2,"0"); return p(d.getDate())+"-"+p(d.getMonth()+1)+"-"+d.getFullYear(); }
function parseSheet(json){
  if(!json.length) return [];
  const headers=Object.keys(json[0]);
  const cId=pickCol(headers,[/^id$/i,/\bid\b/i,/atr\s*id/i]);
  const cEnt=pickCol(headers,[/sbu/i,/entity/i,/\bbu\b/i,/business/i,/location/i]);
  const cPri=pickCol(headers,[/priorit/i,/\bpri\b/i]);
  const cSta=pickCol(headers,[/status/i]);
  const cTar=pickCol(headers,[/target/i,/due\s*date/i,/compliance\s*date/i]);
  const cDays=pickCol(headers,[/overdue/i,/ageing/i,/aging/i,/days\s*past/i]);
  const cCode=pickCol(headers,[/project/i,/\bcode\b/i,/audit\s*ref/i]);
  const cRec=pickCol(headers,[/recommend/i,/observation/i,/particular/i]);
  const cReg=pickCol(headers,[/^region$/i,/\bregion\b/i,/\bzone\b/i]);
  if(!cEnt) throw new Error("Couldn't find an SBU/Entity column. Add a column named 'SBU / Entity'.");
  const today=new Date(); today.setHours(0,0,0,0);
  return json.map(r=>{
    const pri=normPri(cPri?r[cPri]:null);
    const status=cSta?(r[cSta]==null?"":String(r[cSta]).trim()):"";
    let days=null, before2024=false, targetStr="";
    if(cTar){ const d=toDate(r[cTar]); if(d){ d.setHours(0,0,0,0); days=Math.round((today-d)/86400000); before2024 = d < CUT_2024; targetStr=fmtDate(d); } }
    if(days==null && cDays!=null && r[cDays]!=null){ const n=Number(r[cDays]); if(!isNaN(n)) days=n; }
    if(days==null) days=0;
    const region=cReg?String(r[cReg]||"").trim().toUpperCase():"";
    let ent=String(r[cEnt]==null?"":r[cEnt]).trim(); if(!ent||ent.toLowerCase()==="null") ent="Unspecified";
    const id=cId!=null && r[cId]!=null ? String(r[cId]).trim() : null;
    let rec=cRec?String(r[cRec]||"").trim():""; if(rec.length>240) rec=rec.slice(0,237)+"…";
    const code=cCode?String(r[cCode]||"").trim():"";
    return { id, entity:ent, pri, status, days, overdue:days>0, before2024, region, code, rec, targetStr };
  }).filter(r=>r.entity);
}
function parseWorkbook(arrbuf){
  const wb=XLSX.read(arrbuf,{type:"array",cellDates:true});
  const names=wb.SheetNames;
  const curName = names.find(n=>/current/i.test(n)) || names[0];
  const pastName = names.find(n=>/past|previous|prior|last/i.test(n));
  const rows=parseSheet(XLSX.utils.sheet_to_json(wb.Sheets[curName],{defval:null}));
  if(!rows.length) throw new Error("No usable rows found in the current sheet.");
  const prev = pastName ? parseSheet(XLSX.utils.sheet_to_json(wb.Sheets[pastName],{defval:null})) : null;
  return { rows, prev };
}
function regionsOf(rows){ const set=new Set(rows.map(r=>r.region).filter(Boolean)); return Array.from(set).sort(); }
function computeMetrics(rows, region, prev){
  const isClosed=s=>/clos/i.test(s||"");
  let open=rows.filter(r=>!isClosed(r.status));
  if(region && region!=="ALL"){ open=open.filter(r=>r.region===region); }
  const total=open.length;
  const overdue=open.filter(r=>r.overdue).length;
  const high=open.filter(r=>r.pri==="High").length;
  const highOverdue=open.filter(r=>r.pri==="High" && r.overdue).length;
  const beyond1=open.filter(r=>r.days>365).length;
  const buckets=[ {label:"0-90 days", n:open.filter(r=>r.days>0 && r.days<=90).length}, {label:"90-180 days", n:open.filter(r=>r.days>90 && r.days<=180).length}, {label:"180-365 days", n:open.filter(r=>r.days>180 && r.days<=365).length}, {label:"Beyond 1 year", n:beyond1} ];
  const pri={High:high, Medium:open.filter(r=>r.pri==="Medium").length, Low:open.filter(r=>r.pri==="Low").length};
  const byEntMap={};
  const ent=(k)=> byEntMap[k]=byEntMap[k]||{entity:k,total:0,H:0,M:0,L:0,overdue:0,sumOD:0,before2024:0,added:0,reduced:0};
  open.forEach(r=>{ const e=ent(r.entity); e.total++; e[r.pri==="High"?"H":r.pri==="Low"?"L":"M"]++; if(r.overdue){e.overdue++; e.sumOD+=r.days;} if(r.before2024) e.before2024++; });
  let hasCycle=false;
  if(prev && prev.length){
    hasCycle=true;
    const prevOpen=prev.filter(r=>!isClosed(r.status));
    const prevIds=new Set(prevOpen.map(r=>r.id).filter(x=>x!=null));
    const curOpenIds=new Set(open.map(r=>r.id).filter(x=>x!=null));
    open.forEach(r=>{ if(r.id!=null && !prevIds.has(r.id)) ent(r.entity).added++; });
    prevOpen.forEach(r=>{ if(r.id!=null && !curOpenIds.has(r.id)){ if(region && region!=="ALL" && r.region!==region) return; ent(r.entity).reduced++; } });
  }
  const byEntity=Object.values(byEntMap).map(e=>({...e, avgOD: e.overdue? Math.round(e.sumOD/e.overdue):0})).sort((a,b)=>b.total-a.total);
  const statusMap={}; open.forEach(r=>{ const s=r.status||"New"; statusMap[s]=(statusMap[s]||0)+1; });
  const oldest=open.reduce((m,r)=> r.days>m?r.days:m, 0);
  const concentrationGroups=byEntity.map(e=>({label:e.entity, overdue:e.overdue, total:e.total}));
  return {total,overdue,high,highOverdue,beyond1,buckets,pri,byEntity,statusMap,oldest, projects:new Set(open.map(r=>r.code).filter(Boolean)).size, concentrationGroups, hasCycle, source: region && region!=="ALL" ? ("Region: "+region) : ""};
}
function buildAggregate(rows, prev, meta){
  const regions=regionsOf(rows);
  const byRegion={ ALL: computeMetrics(rows,"ALL",prev) };
  regions.forEach(rg=> byRegion[rg]=computeMetrics(rows,rg,prev));
  const isClosed=s=>/clos/i.test(s||"");
  const legacyRows=rows.filter(r=>!isClosed(r.status) && r.before2024)
    .map(r=>({id:r.id, code:r.code, entity:r.entity, region:r.region, rec:r.rec, targetStr:r.targetStr, days:r.days}))
    .sort((a,b)=>b.days-a.days);
  return { fileName:meta.fileName, uploadedAt:meta.uploadedAt, hasCycle: !!(prev&&prev.length), regions, byRegion, legacyRows, total: byRegion.ALL.total };
}
function Donut({pri}){
  const total=pri.High+pri.Medium+pri.Low||1; const mP=pri.Medium/total, lP=pri.Low/total; const a1=mP*360, a2=(mP+lP)*360;
  const style={background:`conic-gradient(var(--blue) 0 ${a1}deg, #9aa7b8 ${a1}deg ${a2}deg, var(--red) ${a2}deg 360deg)`};
  const pct=x=>Math.round(x/total*100);
  return (<div className="donutwrap"><div className="donut" style={style}><div className="dc">{pct(pri.Medium)}%</div></div><div className="dleg"><div><i style={{background:"var(--blue)"}}></i> Medium ({pri.Medium}) · {pct(pri.Medium)}%</div><div><i style={{background:"#9aa7b8"}}></i> Low ({pri.Low}) · {pct(pri.Low)}%</div><div><i style={{background:"var(--red)"}}></i> High ({pri.High}) · {pct(pri.High)}%</div></div></div>);
}
function ScoreCard({e, hasCycle}){
  const [flip,setFlip]=useState(false);
  const col = e.avgOD>500?"var(--red)":e.avgOD>=300?"var(--amber)":"var(--blue)";
  const reduced=e.reduced||0, added=e.added||0, net=reduced-added;
  const prevTotal=e.total+reduced-added;
  const netCls = net>0?"pos":net<0?"neg":"zero";
  const before=e.before2024||0;
  return (
    <div className={"flip"+(flip?" on":"")} onClick={()=>setFlip(!flip)}>
      <div className="flip-inner">
        <div className="flip-face sc-front">
          <div className="sc-top" style={{background:col}}></div>
          <h4>{e.entity} <b style={{color:col}}>{e.total}</b></h4>
          <div className="sc-sub">open points · tap to compare</div>
          <div className="sc-chips"><span className="chip h">H {e.H}</span><span className="chip m">M {e.M}</span><span className="chip l">L {e.L}</span></div>
          <div className={"sc-legacy"+(before?"":" zero")}>{before} pt{before===1?"":"s"} · target before 31.03.2024</div>
          <div className="sc-foot"><span>Avg overdue</span><b style={{color:col}}>{e.avgOD} days</b></div>
        </div>
        <div className="flip-face flip-back sc-back">
          <div className="sc-top" style={{background:"var(--gold)"}}></div>
          <h4>{e.entity}</h4>
          <div className="sc-sub">improvement vs previous cycle</div>
          {hasCycle ? <div>
            <div className="cyc-row red"><span className="ci">{"\u25BC"}</span><div><b>{reduced}</b> resolved <span>· improvement</span></div></div>
            <div className="cyc-row add"><span className="ci">{"\u25B2"}</span><div><b>{added}</b> newly added <span>· this cycle</span></div></div>
            <div className={"cyc-net "+netCls}>{net>0?`Net improvement of ${net} points`:net<0?`Net increase of ${-net} points`:"No net change"} · was {prevTotal}, now {e.total}</div>

      <div className="homecard atr" onClick={()=>go("atr")}><div className="ribbon"></div><div className="hc-top">📋</div><h3>ATR Status</h3><p>The audit open-points dashboard — KPI snapshot, SBU/entity scorecard with cycle-over-cycle improvement, overdue concentration, and the legacy backlog (pre-31.03.2024).</p><div className="mini"><div><b>{openTotal.toLocaleString()}</b><span>Open points</span></div><div><b>4 views</b><span>Snapshot · Scorecard · Concentration · Legacy</span></div></div><div className="go">Open ATR Status →</div></div>
      <div className="homecard rt" onClick={()=>go("themes")}><div className="ribbon"></div><div className="hc-top">📈</div><h3>Recurring Theme Analysis</h3><p>Explore recurring audit themes and issue types by Business Unit — trend analysis, regional statistics, high-priority escalations, system controls and a channel to raise queries.</p><div className="mini"><div><b>{liveCount} units</b><span>Available now</span></div><div><b>6 sections</b><span>per unit</span></div></div><div className="go">Open Recurring Theme Analysis →</div></div>
    </div></div>);
}
function App(){
  const [view,setView]=useState("home"); const [bu,setBu]=useState(null); const goHome=()=>{setBu(null);setView("home");};
  return (<div><header className="app"><BrandLogo onClick={goHome}/><div className="brand"><h1>{DB.meta.app}</h1><p>{DB.meta.tagline}</p></div><div className="spacer"></div><div className="org-tag"><b>BPCL</b> · Internal Audit</div></header>
    {view==="home" && <Home go={setView}/>}{view==="atr" && <ATRStatus onBack={goHome}/>}{view==="themes" && (bu ? <BUDetail buId={bu} onBack={()=>{setBu(null);setView("themes");}}/> : <ThemeDashboard onOpen={setBu} onBack={goHome}/>)}
    <footer><span className="dot-gold"></span> {DB.meta.app} · BPCL Internal Audit</footer></div>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
